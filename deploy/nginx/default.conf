# PageSail — Nginx site configuration (static files only).
#
# The app is a static single-page application: every PDF/image is processed in the
# visitor's browser. This server never needs to accept uploads, so only GET/HEAD are
# allowed and request bodies are capped at 1 KB.

# MIME types missing from the stock mime.types (merged with it, not replacing it).
types {
    text/javascript mjs;
    font/ttf ttf;
    application/octet-stream bcmap pfb icc;
}

# Privacy-friendly access log: no IP address, no user agent, no referrer.
log_format pagesail '[$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 1k;
    access_log /var/log/nginx/access.log pagesail;

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml application/wasm font/ttf application/octet-stream;

    # Security headers. `connect-src 'self'` means the page cannot send data anywhere
    # except this site, and this site accepts no uploads. 'wasm-unsafe-eval' is required
    # by PDF.js' WebAssembly image decoders; inline styles are used by the UI library.
    set $csp "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'";
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;

    # This site accepts no uploads or form posts.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # Health check for Docker.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed build output: cache forever.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    # PDF.js runtime data lives under a versioned folder: cache forever.
    location /vendor/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    # Fonts change rarely but are not content-hashed.
    location /fonts/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    location /licenses/ {
        try_files $uri =404;
        charset utf-8;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Everything else is the single-page app: unknown paths get index.html so that
    # deep links and page refreshes work. HTML is always revalidated.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    }
}
